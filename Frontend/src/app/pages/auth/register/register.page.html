<main id="contenido-register">
  <section id="seccion-register">
    <header id="encabezado-register">
      <h1>Crear cuenta</h1>
      <p>Completa tus datos para registrarte en la plataforma.</p>
    </header>

    <form id="formulario-register" [formGroup]="form" (ngSubmit)="submit()">
      <div class="campo-formulario"><label for="identificacion">Identificación</label><input id="identificacion" type="number" formControlName="identificacion" required /></div>
      <div class="campo-formulario">
        <label for="nombre">Nombre completo</label>
        <input id="nombre" name="nombre" type="text" formControlName="nombre" autocomplete="name" required />
      </div>

      <div class="campo-formulario">
        <label for="email">Correo electrónico</label>
        <input id="email" name="email" type="email" formControlName="email" autocomplete="email" required />
      </div>

      <div class="campo-formulario"><label for="direccion">Dirección</label><input id="direccion" type="text" formControlName="direccion" required /></div>
      <div class="campo-formulario"><label for="id-ciudad">Ciudad</label><input id="id-ciudad" type="number" formControlName="id_ciudad" min="1" required /></div>

      <div class="campo-formulario">
        <label for="password">Contraseña</label>
        <input
          id="password"
          name="password" formControlName="password"
          type="password"
          minlength="6"
          autocomplete="new-password"
          required
        />
      </div>

      <div class="campo-formulario">
        <label for="confirmar-password">Confirmar contraseña</label>
        <input
          id="confirmar-password"
          name="confirmar-password" formControlName="confirmarPassword"
          type="password"
          minlength="6"
          autocomplete="new-password"
          required
        />
      </div>

      <p class="error" *ngIf="errorMessage">{{ errorMessage }}</p><button type="submit" [disabled]="loading">{{ loading ? 'Creando...' : 'Registrarse' }}</button>
    </form>

    <p id="enlace-login">
      ¿Ya tienes cuenta?
      <a routerLink="/login">Inicia sesión</a>
    </p>
  </section>
</main>
