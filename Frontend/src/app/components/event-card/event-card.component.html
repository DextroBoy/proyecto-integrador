@if(event){
    
  <article class="event-card card h-100">
    <div class="event-card__label">
      {{ event.teatro }}
    </div>

    <div class="event-card__image">
      <img
        src="https://placehold.co/600x350/212529/ffffff?text=Evento"
        class="card-img-top"
        alt="Imagen del evento"
      />

      <span class="event-card__status" [class]="getStatusClass()">
        {{ event.estado }}
      </span>
    </div>

    <div class="card-body event-card__body">
      <div class="event-card__location">
        <i class="bi bi-geo-alt"></i>
        <span>{{ event.ciudad }}</span>
      </div>

      <h3 class="event-card__title">
        {{ event.nombre }}
      </h3>

      <div class="event-card__date">
        <i class="bi bi-calendar-event"></i>
        <span>{{ getDate() }}</span>
      </div>

      <div class="event-card__price">
        <span class="event-card__price-label">Desde</span>
        <strong>{{ getPrice() }} COP</strong>
      </div>

      <div class="event-card__footer">
        <a
          [routerLink]="['/client/create-reservation', event.codigo]"
          class="btn btn-primary w-100"
        >
          Ver evento
        </a>
      </div>
    </div>
  </article>
}
