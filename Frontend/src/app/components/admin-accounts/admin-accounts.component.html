<section class="admin-accounts">
  <div class="accounts-heading"><h2>Gestión de cuentas</h2><select [(ngModel)]="role" (ngModelChange)="changeRole()"><option value="clientes">Clientes</option><option value="agentes">Agentes</option><option value="administradores">Administradores</option><option value="personas">Personas</option></select></div>
  <form (ngSubmit)="save()"><input name="identificacion" type="number" placeholder="Identificación" [(ngModel)]="draft['identificacion']" [disabled]="editingId !== null" required><input name="nombre" placeholder="Nombre" [(ngModel)]="draft['nombre']" required><input name="direccion" placeholder="Dirección" [(ngModel)]="draft['direccion']" required><input name="email" type="email" placeholder="Correo" [(ngModel)]="draft['email']" required><input name="id_ciudad" type="number" placeholder="Ciudad" [(ngModel)]="draft['id_ciudad']" required><select *ngIf="role === 'personas'" name="rol" [(ngModel)]="draft['rol']"><option value="CLIENTE">CLIENTE</option><option value="AGENTE">AGENTE</option><option value="ADMIN">ADMIN</option></select><input name="password" type="password" placeholder="Contraseña" [(ngModel)]="draft['password']" [required]="editingId === null"><button type="submit">{{ editingId === null ? 'Crear cuenta' : 'Guardar cambios' }}</button><button *ngIf="editingId !== null" type="button" (click)="cancelEdit()">Cancelar</button></form>
  <p *ngIf="errorMessage" class="error">{{ errorMessage }}</p><p *ngIf="loading">Cargando cuentas...</p>
  <table *ngIf="!loading"><thead><tr><th>Identificación</th><th>Nombre</th><th>Correo</th><th>Rol</th><th>Acciones</th></tr></thead><tbody><tr *ngFor="let account of accounts"><td>{{ account.identificacion }}</td><td>{{ account.nombre }}</td><td>{{ account.email }}</td><td>{{ account.rol }}</td><td><button type="button" (click)="edit(account)">Editar</button><button type="button" (click)="remove(account)">Eliminar</button></td></tr></tbody></table>
</section>
