<section class="admin-accounts">
  <header class="accounts-heading">
    <div>
      <p class="section-eyebrow">Administración</p>
      <h2>Gestión de cuentas</h2>
      <p class="section-description">Crea, consulta y actualiza los usuarios del sistema.</p>
    </div>
    <label class="role-selector" for="account-role">
      <span>Tipo de cuenta</span>
      <select id="account-role" [(ngModel)]="role" (ngModelChange)="changeRole()">
        <option value="clientes">Clientes</option>
        <option value="agentes">Agentes</option>
        <option value="administradores">Administradores</option>
        <option value="personas">Personas</option>
      </select>
    </label>
  </header>

  <form class="account-form" (ngSubmit)="save()">
    <label class="account-field" for="account-identification">
      <span>Identificación</span>
      <input id="account-identification" name="identificacion" type="number" min="1" placeholder="Número de identificación" [(ngModel)]="draft['identificacion']" [disabled]="editingId !== null" required>
    </label>
    <label class="account-field" for="account-name">
      <span>Nombre completo</span>
      <input id="account-name" name="nombre" placeholder="Nombre completo" [(ngModel)]="draft['nombre']" required>
    </label>
    <label class="account-field" for="account-address">
      <span>Dirección</span>
      <input id="account-address" name="direccion" placeholder="Dirección" [(ngModel)]="draft['direccion']" required>
    </label>
    <label class="account-field" for="account-email">
      <span>Correo electrónico</span>
      <input id="account-email" name="email" type="email" placeholder="correo@ejemplo.com" [(ngModel)]="draft['email']" required>
    </label>
    <label class="account-field" for="account-city">
      <span>Identificador de ciudad</span>
      <input id="account-city" name="id_ciudad" type="number" min="1" placeholder="ID de ciudad" [(ngModel)]="draft['id_ciudad']" required>
    </label>
    <label class="account-field" for="account-password">
      <span>Contraseña {{ editingId !== null ? '(opcional para actualizar)' : '' }}</span>
      <input id="account-password" name="password" type="password" autocomplete="new-password" placeholder="Contraseña" [(ngModel)]="draft['password']" [required]="editingId === null">
    </label>
    <label *ngIf="role === 'personas'" class="account-field" for="account-user-role">
      <span>Rol</span>
      <select id="account-user-role" name="rol" [(ngModel)]="draft['rol']">
        <option value="CLIENTE">Cliente</option>
        <option value="AGENTE">Agente</option>
        <option value="ADMIN">Administrador</option>
      </select>
    </label>
    <div class="form-actions">
      <button class="button button-primary" type="submit">
        {{ editingId === null ? 'Crear cuenta' : 'Guardar cambios' }}
      </button>
      <button *ngIf="editingId !== null" class="button button-secondary" type="button" (click)="cancelEdit()">Cancelar</button>
    </div>
  </form>

  <p *ngIf="errorMessage" class="error-message" role="alert">{{ errorMessage }}</p>
  <p *ngIf="loading" class="loading-message" role="status">Cargando cuentas...</p>

  <div *ngIf="!loading" class="accounts-table-wrapper">
    <table class="accounts-table">
      <thead>
        <tr><th>Identificación</th><th>Nombre</th><th>Correo</th><th>Rol</th><th>Acciones</th></tr>
      </thead>
      <tbody>
        <tr *ngFor="let account of accounts">
          <td>{{ account.identificacion }}</td>
          <td>{{ account.nombre }}</td>
          <td>{{ account.email }}</td>
          <td><span class="role-badge">{{ account.rol }}</span></td>
          <td class="table-actions">
            <button class="button button-edit" type="button" (click)="edit(account)">Editar</button>
            <button class="button button-delete" type="button" (click)="remove(account)">Eliminar</button>
          </td>
        </tr>
        <tr *ngIf="accounts.length === 0">
          <td colspan="5" class="empty-state">No hay cuentas en esta categoría.</td>
        </tr>
      </tbody>
    </table>
  </div>
</section>
